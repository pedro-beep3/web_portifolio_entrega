<!DOCTYPE html>
<html lang="es">

<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>

                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Escríbeme un mensaje</h2>
            <p>Este formulario es una práctica y todavía no envía los mensajes a ningún sitio.</p>
            <form action="#">
                <p>
                    <label for="nombre">Tu nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="correo">Tu correo:</label><br>
                    <input type="email" id="correo" name="correo" required>
                </p>
                <p>
                    <label for="mensaje">Tu mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </p>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p><a href="index.html">Volver al inicio</a></p>
    </footer>
</body>
</html>
